services:
  # ----------------------------------------------------
  # 1. KEA Backend REST API (Node.js / Express Web Service)
  # ----------------------------------------------------
  - type: web
    name: kea-backend-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CORS_ORIGIN
        value: '*'

  # ----------------------------------------------------
  # 2. KEA Frontend Portal (React / Vite Static Site)
  # ----------------------------------------------------
  - type: static
    name: kea-frontend-portal
    runtime: static
    rootDir: frontend
    buildCommand: npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_APP_TITLE
        value: "Karnataka Examinations Authority (KEA)"
      - key: VITE_APP_ENV
        value: production
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: kea-backend-api
          property: host
